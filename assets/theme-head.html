FFABRRRQB//9k=';</script><style>:root[data-ml4hl-theme] {
  --hl-paper:var(--ml-bg); --hl-surface:var(--ml-surface); --hl-ink:var(--ml-ink);
  --hl-muted:var(--ml-muted); --hl-panel:var(--ml-panel); --hl-rule:var(--ml-border);
  --hl-blue:var(--ml-blue); --hl-orange:var(--ml-orange); --hl-green:var(--ml-green);
  --hl-red:var(--ml-red); --hl-gold:var(--ml-gold);
  --bg:var(--ml-bg); --paper:var(--ml-surface); --ink:var(--ml-ink); --muted:var(--ml-muted);
  --line:var(--ml-border); --code-bg:var(--ml-panel);
  --blue:var(--ml-blue); --orange:var(--ml-orange); --green:var(--ml-green); --red:var(--ml-red);
  --sans:'Avenir Next', Avenir, system-ui, sans-serif; --mono:ui-monospace, SFMono-Regular, Consolas, monospace;
}
body {font-family:var(--sans); color:var(--ml-ink); background:var(--ml-bg);}
a {color:var(--ml-blue);}
.ml4hl-appearance {display:flex; gap:12px 24px; flex-wrap:wrap; align-items:center; padding:12px 0; margin-bottom:18px; font:13px/1.5 var(--sans); grid-column:1/-1;}
.ml4hl-appearance label {display:inline-flex; gap:8px; align-items:center;}
.ml4hl-appearance select {background:var(--ml-surface);color:var(--ml-ink);border:1px solid var(--ml-border);border-radius:3px;padding:7px;font:inherit;max-width:100%;}
:focus-visible {outline:2px solid var(--ml-blue);outline-offset:3px;}
.quarto-title {position:relative; padding-right:155px;}
.ml4hl-logo {position:absolute;right:0;top:0;width:125px;height:125px;object-fit:contain;background:white;border:1px solid var(--ml-border);border-radius:4px;}
.quarto-title-block .subtitle,.field-card p,.g-intro,.g-side a.is-alt {color:var(--ml-muted);}
.quarto-color-scheme-toggle {display:none !important;}
[data-ml4hl-theme] .ml4hl.widget {--bg:var(--ml-bg);--surface:var(--ml-surface);--fg:var(--ml-ink);--muted:var(--ml-muted);--faint:var(--ml-faint);--border:var(--ml-border);--grid:var(--ml-grid);--code-bg:var(--ml-panel);--blue:var(--ml-blue);--orange:var(--ml-orange);--green:var(--ml-green);--red:var(--ml-red);--sans:system-ui,sans-serif;--mono:ui-monospace,monospace;}
.ml4hl-plot img {display:none;width:100%;height:auto;}
.ml4hl-plot img[data-mode="light"] {display:block;}
html[data-ml4hl-theme="dark"] .ml4hl-plot img[data-mode="light"] {display:none;}
html[data-ml4hl-theme="dark"] .ml4hl-plot img[data-mode="dark"] {display:block;}
html[data-ml4hl-plots="original"] .ml4hl-plot img[data-mode] {display:none;}
html[data-ml4hl-plots="original"] .ml4hl-plot img[data-mode="original"] {display:block;}
html[data-ml4hl-theme="dark"] .table,html[data-ml4hl-theme="dark"] table {--bs-table-color:var(--ml-ink);--bs-table-bg:var(--ml-surface);color:var(--ml-ink);}
.seg button.on,.tool.on {color:var(--ml-bg);}
@media(max-width:600px){.quarto-title{padding-right:0;padding-top:100px}.ml4hl-logo{left:0;width:80px;height:80px}.ml4hl-appearance{padding:12px;}}
@media print{.ml4hl-appearance{display:none}.ml4hl-plot img[data-mode]{display:none!important}.ml4hl-plot img[data-mode="light"]{display:block!important}}

</style><script>window.ML4HL_THEME_CONFIG={"name": "Graphite & Spectrum", "description": "Sans-serif text throughout, with violet, blue, and coral accents drawn from the logo.", "body": "'Avenir Next', Avenir, system-ui, sans-serif", "heading": "'Avenir Next', Avenir, system-ui, sans-serif", "light": {"bg": "#FAFAFC", "surface": "#FFFFFF", "ink": "#292936", "muted": "#626273", "border": "#DCDCE6", "grid": "#E7E7EE", "panel": "#F0EFF5", "blue": "#6554A4", "orange": "#BA5960", "green": "#286FA3", "red": "#AC404E", "purple": "#815891", "faint": "#DCDCE6", "codeBg": "#F0EFF5", "gold": "#976B16", "teal": "#187777", "blueDeep": "#6554A4", "blueSoft": "#F0EFF5", "orangeDeep": "#BA5960", "orangeSoft": "#F0EFF5", "greenSoft": "#F0EFF5", "pink": "#A43D7C", "olive": "#58752D", "cyan": "#247A95", "brown": "#8A5A32", "slate": "#59647A", "lavender": "#776ABB"}, "dark": {"bg": "#17181D", "surface": "#21222B", "ink": "#EEEFF7", "muted": "#B7B8C9", "border": "#454656", "grid": "#373847", "panel": "#2A2B37", "blue": "#B6A5EF", "orange": "#F29BA3", "green": "#83BCE5", "red": "#F08B98", "purple": "#D3ACE4", "faint": "#454656", "codeBg": "#2A2B37", "gold": "#E8C273", "teal": "#7CC7C7", "blueDeep": "#B6A5EF", "blueSoft": "#2A2B37", "orangeDeep": "#F29BA3", "orangeSoft": "#2A2B37", "greenSoft": "#2A2B37", "pink": "#EBA4CF", "olive": "#B5D48C", "cyan": "#8AD2E7", "brown": "#E9B58B", "slate": "#A6AEC4", "lavender": "#C2B9FF"}, "categorical": ["blue", "orange", "green", "red", "purple", "teal", "pink", "olive", "cyan", "brown", "slate", "lavender"]};</script><script>(function () {
  'use strict';
  if (window.ML4HLTheme) return;
  var config = window.ML4HL_THEME_CONFIG, media = matchMedia('(prefers-color-scheme: dark)');
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('ml4hl-appearance') || '{}'); } catch (_) {}
  var state = {theme: ['light','dark','auto'].includes(saved.theme) ? saved.theme : 'auto', plots: saved.plots === 'original' ? 'original' : 'follow'};
  function apply() {
    var mode = state.theme === 'auto' ? (media.matches ? 'dark' : 'light') : state.theme;
    var root = document.documentElement, c = config[mode];

    root.style.colorScheme = mode;
    Object.keys(c).forEach(function (key) { root.style.setProperty('--ml-' + key, c[key]); });
    if (document.body) {
      document.body.classList.toggle('quarto-dark', mode === 'dark');
      document.body.classList.toggle('quarto-light', mode === 'light');
    }
    // Let Quarto's own theme switch its syntax highlighting and Bootstrap rules.
    document.querySelectorAll('link.quarto-color-scheme').forEach(function (link) {
      link.rel = !link.classList.contains('quarto-color-alternate') || mode === 'dark' ? 'stylesheet' : 'prefetch';
    });
    if (window.ML4HL) {
      Object.assign(ML4HL.C, c);
      ML4HL.cat.splice(0, ML4HL.cat.length, ...config.categorical.map(function(k){return c[k];}));
    }
    document.querySelectorAll('[data-ml-theme-control]').forEach(function(el){el.value=state.theme;});
    document.querySelectorAll('[data-ml-plot-control]').forEach(function(el){el.value=state.plots;});
    document.dispatchEvent(new CustomEvent('ml4hl-theme', {detail:{mode:mode}}));
    try { localStorage.setItem('ml4hl-appearance', JSON.stringify(state)); localStorage.setItem('quarto-color-scheme', mode === 'dark' ? 'alternate' : 'default'); } catch (_) {}
  }
  function controls(parent) {
    if (document.querySelector('.ml4hl-appearance')) return;
    var bar = document.createElement('div'); bar.className = 'ml4hl-appearance';
    bar.innerHTML = '<label>Page Theme <select aria-label="Page Theme" data-ml-theme-control><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Plot Style <select aria-label="Plot Style" data-ml-plot-control><option value="follow">Follow Page Theme</option><option value="original">Keep Original Plot Style</option></select></label>';
    parent.prepend(bar);
    bar.querySelector('[data-ml-theme-control]').addEventListener('change',function(e){state.theme=e.target.value;apply();});
    bar.querySelector('[data-ml-plot-control]').addEventListener('change',function(e){state.plots=e.target.value;apply();});
  }
  function ready() {
    var parent = document.querySelector('.g-main') || document.querySelector('main.content') || document.body;
    controls(parent);

  }
  window.ML4HLTheme = {apply:apply, state:state};
  media.addEventListener('change',function(){if(state.theme==='auto') apply();});
  apply();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',ready); else ready();
})();
</script>
